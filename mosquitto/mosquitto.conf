# Local-only broker for Frigate + Home Assistant.
# No external exposure by default (see docker-compose.yml).
#
# Notes:
# - This is intentionally simple for MVP (allow_anonymous).
# - If you later want stronger auth:
#   - set allow_anonymous false
#   - add password_file + ACLs
#   - optionally publish 1883 only on 127.0.0.1 and keep firewall rules tight

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Private docker network only; anonymous is acceptable for MVP.
allow_anonymous true
listener 1883 0.0.0.0
